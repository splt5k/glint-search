<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="app">
      <!-- Cápsula + 4 botões redondos (Aplicativos, Arquivos, Ações, Área de transferência) -->
      <div id="bar">
        <div id="pill" class="glass clear">
          <div class="glass-bg"></div><div class="glass-tint"></div>
          <div class="pill-inner">
            <svg class="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
            <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Glint Search" />
            <div id="form" hidden></div>
            <button id="clear" hidden title="Limpar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.2 12.8-1.4 1.4L12 13.4l-2.8 2.8-1.4-1.4L10.6 12 7.8 9.2l1.4-1.4L12 10.6l2.8-2.8 1.4 1.4L13.4 12z"/></svg></button>
          </div>
        </div>
        <button class="cat glass clear" data-f="apps" title="Aplicativos  (Ctrl+1)">
          <div class="glass-bg"></div><div class="glass-tint"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 20M12 3l7.5 17M7 14.5h10"/></svg>
        </button>
        <button class="cat glass clear" data-f="files" title="Arquivos  (Ctrl+2)">
          <div class="glass-bg"></div><div class="glass-tint"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 012-2h4l2 2.2h7a2 2 0 012 2V17a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg>
        </button>
        <button class="cat glass clear" data-f="actions" title="Ações  (Ctrl+3)">
          <div class="glass-bg"></div><div class="glass-tint"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8.5 4.5L12 12 3.5 7.5zM3.5 12 12 16.5l8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg>
        </button>
        <button class="cat glass clear" data-f="clip" title="Área de transferência  (Ctrl+4)">
          <div class="glass-bg"></div><div class="glass-tint"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="4.5" width="13" height="16.5" rx="2.2"/><path d="M9 4.5V4a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 4v.5M9 11h6M9 15h4"/></svg>
        </button>
      </div>

      <!-- Painel de resultados -->
      <div id="panel" class="glass" hidden>
        <div class="glass-bg"></div><div class="glass-tint"></div>
        <div class="panel-inner">
          <div id="phead"></div>
          <div id="chips"></div>
          <div id="pbody"></div>
          <div id="qkbar" hidden></div>
          <div id="ql" hidden></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
